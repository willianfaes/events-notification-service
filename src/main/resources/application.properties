spring.application.name=events-notification-service
spring.profiles.active=local

# 8080 and 8081 belong to the API (app and management), 8090 to Kafbat UI.
server.port=8082

# Its own database in the Postgres container of the API's compose. Create it once, from the API folder:
# docker compose exec db createdb -U events_manager_app events_notification_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/events_notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:events_manager_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
